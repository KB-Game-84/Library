<style>
:root{--ink:#1c1850;--pop:#ff5a36}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;
 background:radial-gradient(circle at 20% 10%,#4b2fa0,#1c1850 60%,#0d0a2e) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:1500px;margin:0 auto;padding:12px 16px}
body.pl #app{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:8px}
h1{margin:0;color:#fff;font-size:clamp(22px,3.4vw,40px);text-shadow:0 3px 0 #000}h1 small{font-size:.55em;opacity:.8;font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.status{background:#fff;border-radius:999px;padding:8px 20px;font-weight:600;font-size:clamp(16px,2.2vw,26px)}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn{font:inherit;font-weight:600;font-size:19px;border:0;border-radius:16px;padding:12px 22px;background:var(--pop);color:#fff;cursor:pointer;box-shadow:0 5px 0 #b3361a;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b3361a}.btn:disabled{background:#9db1cc;box-shadow:0 5px 0 #6f84a3;cursor:default}
.btn.alt{background:#e8f0fa;color:var(--ink);box-shadow:0 5px 0 #9db1cc}.btn.alt.on{background:var(--ink);color:#fff;box-shadow:0 5px 0 #000}.btn.sm{font-size:15px;padding:8px 14px}
.lob{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}@media(max-width:900px){.lob{grid-template-columns:1fr}}
.stack{display:grid;gap:14px}.code{font-size:clamp(48px,8vw,80px);line-height:1;letter-spacing:8px;color:var(--pop)}
.join{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.join small{display:block;color:#5a6f92;word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.hl{color:#5a6f92;font-size:15px;margin:2px 0 8px;line-height:1.4}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-weight:500}
input[type=text]{font:inherit;font-size:18px;padding:8px 10px;border-radius:12px;border:2px solid var(--ink);width:110px;text-align:center}
input[type=checkbox]{width:26px;height:26px}.prow{display:flex;align-items:center;gap:8px;margin:6px 0}.prow b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow i{width:14px;height:14px;border-radius:50%}
.home{background:rgba(255,255,255,.9);color:var(--ink);text-decoration:none;font-weight:600;border-radius:999px;padding:8px 18px}
/* host map */
#mapbox{position:relative;width:min(100%,calc((100vh - 200px)*1.5556));aspect-ratio:1680/1080;margin:0 auto;background:#fff8e7;border-radius:20px;box-shadow:0 8px 0 rgba(0,0,0,.4);overflow:hidden}
#map,#curs{position:absolute;inset:0}
.e{position:absolute;transform:translate(-50%,-50%);line-height:1;font-style:normal;transition:transform .3s,opacity .3s}
.e.gone{transform:translate(-50%,-50%) scale(2.4);opacity:0;pointer-events:none}
.cur{position:absolute;pointer-events:none;transition:left .07s linear,top .07s linear;z-index:3}.cur svg{display:block;margin:-2px 0 0 -3px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.cur span{position:absolute;left:16px;top:22px;color:#fff;font-size:13px;font-weight:600;padding:1px 7px;border-radius:8px;white-space:nowrap}.cur.fz{opacity:.4}
.ring{position:absolute;width:3.6em;height:3.6em;border:5px solid;border-radius:50%;transform:translate(-50%,-50%);animation:ring .8s ease-out forwards;pointer-events:none;z-index:2}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
#strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pc{background:#fff;border-radius:999px;padding:6px 16px;border:4px solid var(--c);font-weight:600;font-size:clamp(14px,1.8vw,20px)}.pc em{font-style:normal;background:#ffd23f;border-radius:999px;padding:0 6px}
.cd{position:absolute;inset:0;display:none;place-items:center;background:rgba(26,16,64,.95);color:#fff;font-size:clamp(70px,16vw,180px);font-weight:700;z-index:6;text-align:center}.cd.show{display:grid}
.over{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);z-index:8;padding:16px}.over .card{text-align:center;max-width:620px;width:100%}
.over h2{font-size:clamp(28px,5vw,48px);margin:0 0 6px}.over table{margin:12px auto;border-collapse:collapse;font-size:20px}.over td{padding:4px 12px}.under{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
/* phone */
.phone{max-width:480px;margin:0 auto;display:grid;gap:12px;text-align:center}.phone input{font:inherit;font-size:24px;width:100%;padding:12px;border-radius:16px;border:3px solid var(--ink);text-align:center;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.hint{color:#fff;font-weight:600;font-size:20px;min-height:26px}.err{color:#ffb3b3}.roll{width:100%;font-size:32px;padding:20px;border-radius:22px}
.hud{display:flex;justify-content:space-around;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 10px;font-weight:600;flex-wrap:wrap}.tg{font-size:24px}.tg b{font-size:1.05em}
#vw{position:relative;flex:1;min-height:0}#vp{position:absolute;inset:0;overflow:hidden;border-radius:16px;background:#fff8e7;touch-action:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pe{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;display:grid;place-items:center;font-size:36px;line-height:1;font-style:normal}.pe.gone{visibility:hidden}
.pe.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.zb{position:absolute;right:8px;bottom:8px;display:flex;gap:8px;z-index:4}.zb button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(28,24,80,.85);color:#fff;font-size:26px;line-height:1}
#pad{flex:1;min-height:0;position:relative;border-radius:18px;touch-action:none;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-size:20px;
 background:repeating-linear-gradient(0deg,#ffffff18 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,#ffffff18 0 1px,transparent 1px 32px),#2e2a7a}
.frz{position:fixed;inset:0;display:none;place-items:center;background:rgba(150,210,255,.6);backdrop-filter:blur(3px);font-size:38px;font-weight:700;color:#0b2a4a;z-index:30;pointer-events:none}.frz.show{display:grid}
.flash-ok{background:#2a9d8f!important}.flash-bad{background:#d62828!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
#fs{position:fixed;right:12px;bottom:12px;z-index:20;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#14284b;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
</style>
</head>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async b=>{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw j.error||'Something went wrong';return j};
const room=new URLSearchParams(location.search).get('room'),isHost=!room;
let S=null,me=null,hk=null,msg='',off=0,qrEl=null,M=null,mapRid=null,built=null,hid=new Set(),curEls={},localFz=0,lastN=null,seen=0,first=true;
const V={x:0,y:0,z:1},ZS=[.6,.8,1,1.3,1.7];let zi=2,drag=null;
const sNow=()=>Date.now()+off,pl=id=>S.players.find(p=>p.id===id);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};

/* ---------- sounds (made in the browser, no files) ---------- */
let AC=null;
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
document.addEventListener('pointerdown',unlock,{passive:true});
function beep(f,d=.12,type='sine',v=.15,when=0){if(!S||!S.set.audio||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const snd={pop:()=>{beep(660,.08,'triangle');beep(990,.1,'triangle',.12,.06)},bad:()=>beep(130,.35,'sawtooth',.16),tick:()=>beep(520,.1),go:()=>beep(880,.4,'square',.1),
  win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.25,'triangle',.18,i*.14))};
const vib=p=>{if(navigator.vibrate)navigator.vibrate(p)};

/* ---------- text helpers ---------- */
function tgtText(){const s=S.set,t=S.targets;
  if(s.type==='timed')return `Find as many ${t[0]} as you can!`;
  if(s.type==='triple')return 'Find '+t.map((e,i)=>`${S.need[i]} ${e}`).join('  ');
  return `Find ${S.need[0]} ${t[0]}`}
const prog=p=>S.targets.map((e,i)=>`${e}${p.found[i]}${S.need[i]?'/'+S.need[i]:''}`).join(' ');
function clockText(){const n=sNow();
  if(S.phase==='countdown')return 'Get ready…';if(S.phase==='roundover')return 'Finished!';
  if(S.set.type==='timed')return '⏱ '+fmt(S.endsAt-n);
  const t=Math.floor(Math.max(0,n-S.t0)/1000);return '⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}

/* ---------- plumbing ---------- */
function connect(q){const es=new EventSource('/events?'+q);es.onmessage=e=>incoming(JSON.parse(e.data));
  if(isHost)es.addEventListener('cur',e=>cursors(JSON.parse(e.data)));
  es.onerror=()=>{if(es.readyState===2){if(isHost){localStorage.removeItem('rushHost');location.reload()}else{S=null;msg='This room has closed. Ask the host for a new code.';draw()}}}}
function incoming(n){const pp=S&&S.phase;S=n;off=n.now-Date.now();const L=n.last;
  if(first){seen=L?L.seq:0;first=false}else if(L&&L.seq>seen){seen=L.seq;onEvent(L)}
  if(pp&&pp!==n.phase)onPhase(n.phase);draw()}
function onEvent(L){if(!isHost||!M)return;const p=pl(L.id);if(!p)return;if(L.ok){snd.pop();ring(L.item,p.color)}else{snd.bad();ring(L.item,'#555')}}
function onPhase(ph){lastN=null;if(isHost){if(ph==='play')snd.go();if(ph==='roundover')snd.win()}else if(ph==='roundover')vib([100,60,100])}
function draw(){document.body.classList.toggle('pl',!isHost&&!!me&&!!S&&['countdown','play'].includes(S.phase));isHost?drawHost():drawPhone();tick()}
async function loadMap(){const rid=S.rid;try{const m=await api({a:'map',room:S.code||room});if(!S||S.rid!==rid)return;M=m;mapRid=rid;isHost?buildHostMap():buildWorld()}catch(e){}}
function applyRemoved(){if(!M||mapRid!==S.rid)return;const root=isHost?$('#map'):$('#world');if(!root)return;
  for(const id of S.removed){if(!hid.has(id)){hid.add(id);const el=root.children[id];if(el)el.classList.add('gone')}}}

/* ---------- Host screen ---------- */
function drawHost(){
  if(!S){app.innerHTML='<div class="top"><h1>🔎 Emoji Rush</h1></div><p class="hint">Setting up your room…</p>';return}
  if(S.phase==='lobby'){built=null;if(['INPUT','SELECT'].includes((document.activeElement||{}).tagName))return;lobbyHost();return}
  playHost()}
function lobbyHost(){
  const s=S.set,url=`${location.origin}/emoji-rush?room=${S.code}`,N=S.players.length,timed=s.type==='timed';
  const typ=(k,l)=>`<button class="btn alt ${s.type===k?'on':''}" data-a="set" data-k="type" data-v="${k}">${l}</button>`;
  const mod=(k,l)=>`<button class="btn alt ${s.mode===k?'on':''}" data-a="set" data-k="mode" data-v="${k}">${l}</button>`;
  const desc={classic:`Race to find ${s.need} of one target emoji. First to finish wins the round.`,first:`A quick sprint: the first to find ${s.need} of the target emoji wins.`,
    timed:`Find as many of the target emoji as you can in ${s.secs} seconds. Most wins.`,triple:`Three target emojis: first to find ${s.need} of each wins.`}[s.type];
  app.innerHTML=`<div class="top"><h1>🔎 Emoji Rush</h1><a class="home" href="/">All games</a></div><div class="lob"><div class="stack">
    <div class="card join"><div><div>Join on your phone with code</div><b class="code">${S.code}</b><small>${esc(url)}</small></div><div id="qr"></div></div>
    <div class="card"><b>Players (${N}/20)</b>${N?S.players.map(p=>`<div class="prow"><i style="background:${p.color}"></i><b>${esc(p.name)}${p.on?'':' ⚠'}</b><button class="btn alt sm" data-a="kick" data-id="${p.id}">✕</button></div>`).join(''):'<p class="hl">Waiting for players to join…</p>'}
    <p class="hl">The host screen doesn't play. If you're playing too, join on your own phone.</p></div></div>
    <div class="stack"><div class="card"><b>Game type</b><div class="two">${typ('classic','🍕 Classic')}${typ('first','🦄 First To')}${typ('timed','🚀 Most in '+s.secs+'s')}${typ('triple','🍕🚀🦄 Triple Hunt')}</div>
      <p class="hl">${desc} The target emojis are picked at random each round.</p>
      <label>${timed?'Seconds':'Number to find'}<input type="text" inputmode="numeric" maxlength="3" data-set="${timed?'secs':'need'}" value="${timed?s.secs:s.need}"></label>
      <b>Control mode</b><div class="two">${mod('zoom','🔍 Zoom')}${mod('mouse','🖱️ Mouse')}</div>
      <p class="hl">${s.mode==='zoom'?'Each phone shows a zoomed, draggable part of the map. Tap an emoji to claim it.':'Each phone is a trackpad for a pointer on this big screen, plus a click button.'}</p>
      <label>Shuffle emojis on phones${s.mode==='mouse'?' (zoom only)':''}<input type="checkbox" data-set="shuffle" ${s.shuffle?'checked':''} ${s.mode==='mouse'?'disabled':''}></label>
      <p class="hl">On = everyone sees the same emojis, but arranged differently on their own phone.</p>
      <label>Wrong-tap freeze (0–10 seconds)<input type="text" inputmode="numeric" maxlength="2" data-set="freeze" value="${s.freeze}"></label>
      <label>Sound<input type="checkbox" data-set="audio" ${s.audio?'checked':''}></label>
      <button class="btn" style="width:100%;margin-top:6px" data-a="start" ${N?'':'disabled'}>Start round</button></div></div></div>`;
  if(!qrEl&&window.QRCode){qrEl=document.createElement('div');try{new QRCode(qrEl,{text:url,width:130,height:130})}catch(e){qrEl=null}}if(qrEl)$('#qr').appendChild(qrEl)}
function playHost(){
  if(built!==S.rid){built=S.rid;M=null;hid=new Set();curEls={};
    app.innerHTML=`<div class="top"><h1 id="ttl"></h1><div class="status" id="clock"></div></div><div id="mapbox"><div id="map"></div><div id="curs"></div><div class="cd" id="cd"></div></div><div id="strip"></div><div id="ov"></div>`;loadMap()}
  $('#ttl').innerHTML=tgtText()+` <small>· ${S.targets.map((e,i)=>e+' '+S.left[i]).join(' ')} left</small>`;
  $('#strip').innerHTML=S.players.slice().sort((a,b)=>b.total-a.total).map(p=>`<div class="pc" style="--c:${p.color}"><b>${esc(p.name)}</b> ${prog(p)}${p.fz>sNow()?' ❄️':''}${p.wins?` <em>🏆${p.wins}</em>`:''}${p.on?'':' ⚠'}</div>`).join('');
  const cu=$('#curs');cu.style.display=S.set.mode==='mouse'?'':'none';
  S.players.forEach(p=>{if(!curEls[p.id])cursors({[p.id]:[.5,.5]});curEls[p.id].classList.toggle('fz',p.fz>sNow())});
  applyRemoved();fit();overlay()}
function buildHostMap(){const mp=$('#map');if(!mp)return;
  mp.innerHTML=M.e.map((e,i)=>`<i class="e" style="left:${(M.x[i]/M.w*100).toFixed(2)}%;top:${(M.y[i]/M.h*100).toFixed(2)}%">${e}</i>`).join('');hid=new Set();fit();applyRemoved()}
const fit=()=>{const b=$('#mapbox');if(b)b.style.fontSize=(b.clientWidth*40/1680)+'px'};addEventListener('resize',fit);
function cursors(m){const c=$('#curs');if(!c||!S)return;
  for(const id in m){const p=pl(id);if(!p)continue;let el=curEls[id];
    if(!el){el=curEls[id]=document.createElement('div');el.className='cur';
      el.innerHTML=`<svg viewBox="0 0 24 24" width="30" height="30"><path d="M3 2 L3 19 L8 14.5 L11.5 22 L14.5 20.5 L11 13.5 L18 13 Z" fill="${p.color}" stroke="#fff" stroke-width="1.6"/></svg><span style="background:${p.color}">${esc(p.name)}</span>`;c.appendChild(el)}
    el.style.left=m[id][0]*100+'%';el.style.top=m[id][1]*100+'%'}}
function ring(i,c){const b=$('#mapbox');if(!b||!M)return;const d=document.createElement('div');d.className='ring';d.style.cssText=`left:${M.x[i]/M.w*100}%;top:${M.y[i]/M.h*100}%;border-color:${c}`;b.appendChild(d);setTimeout(()=>d.remove(),850)}
function overlay(){const o=$('#ov');if(!o)return;if(S.phase!=='roundover'){o.innerHTML='';return}
  const w=S.winners.map(pl).filter(Boolean),rows=S.players.slice().sort((a,b)=>b.wins-a.wins||b.total-a.total).map(p=>`<tr><td>${esc(p.name)}</td><td>${prog(p)}</td><td>🏆 ${p.wins}</td></tr>`).join('');
  o.innerHTML=`<div class="over"><div class="card"><h2>${w.length?'🏆 '+w.map(p=>esc(p.name)).join(' & ')+(w.length>1?' tie!':' wins!'):'No one found any!'}</h2><p>Round ${S.round}</p><table>${rows}</table>
    <div class="under"><button class="btn" data-a="next">Next round →</button><button class="btn alt" data-a="lobby">Change settings</button></div></div></div>`}
app.onclick=async e=>{unlock();const a=e.target.closest('[data-a]');if(!a||!isHost)return;const d=a.dataset;
  try{await api(d.a==='set'?{a:'settings',room:S.code,hostKey:hk,[d.k]:d.v}:{a:d.a,room:S.code,hostKey:hk,id:d.id})}catch(x){alert(x)}};
app.onchange=async e=>{const t=e.target;if(!isHost||!t.dataset.set)return;t.blur();
  try{await api({a:'settings',room:S.code,hostKey:hk,[t.dataset.set]:t.type==='checkbox'?t.checked:t.value})}catch(x){alert(x)}};
app.addEventListener('focusout',()=>setTimeout(()=>isHost&&S&&draw(),80));

/* ---------- Phone ---------- */
function drawPhone(){
  const top=`<div class="top"><h1>🔎 Emoji Rush</h1></div>`;
  if(!me){built=null;app.innerHTML=top+`<div class="phone"><div class="card"><p>Room <b>${esc(room)}</b></p><input id="nm" maxlength="14" placeholder="Your name" autocomplete="off"><button class="btn roll" id="go">Join game</button></div>${msg?`<p class="hint err">${esc(msg)}</p>`:''}</div>`;
    $('#go').onclick=join;$('#nm').onkeydown=e=>{if(e.key==='Enter')join()};return}
  if(!S){app.innerHTML=top+`<p class="hint ${msg?'err':''}">${esc(msg||'Connecting…')}</p>`;return}
  const p=S.players.find(p=>p.id===me.id);if(!p){app.innerHTML=top+'<p class="hint err">You are not in this room.</p>';return}
  if(S.phase==='lobby'||S.phase==='roundover'){built=null;
    const help=S.set.mode==='zoom'?'Zoom mode: drag to explore the big emoji map, tap the target emoji to claim it.':'Mouse mode: drag on your phone to move your pointer on the big screen, then press CLICK.';
    let h;if(S.phase==='lobby')h=`Hi ${esc(p.name)}! You're in 🎉<br>Waiting for the host to start…`;
    else{const won=S.winners.includes(p.id),w=S.winners.map(pl).filter(Boolean).map(x=>esc(x.name)).join(' & ');h=won?'🏆 You won the round!':w?`${w} won the round`:'Nobody found any!';h+=`<br><small>Waiting for the next round…</small>`}
    app.innerHTML=top+`<div class="phone"><div class="hint">${h}</div><div class="card"><p>${help}</p>${S.phase==='roundover'?`<p><b>You:</b> ${prog(p)} · 🏆 ${p.wins}</p>`:''}</div></div>`;return}
  playPhone(p)}
const hudHTML=p=>S.targets.map((e,i)=>`<span class="tg">${e} <b>${p.found[i]}${S.need[i]?'/'+S.need[i]:''}</b></span>`).join('')+'<span class="tg" id="clk"></span>';
function playPhone(p){
  const key=S.rid+S.set.mode;
  if(built!==key){built=key;M=null;hid=new Set();
    app.innerHTML=S.set.mode==='zoom'
      ?`<div class="hud" id="hud"></div><div id="vw"><div id="vp"><div id="world"></div></div><div class="zb"><button id="zm">−</button><button id="zp">+</button></div><div class="cd" id="cd"></div></div><div class="frz" id="frz"></div>`
      :`<div class="hud" id="hud"></div><div id="pad">Drag here to move the pointer on the big screen 👆<div class="cd" id="cd"></div></div><button class="btn roll" id="clk2">🎯 CLICK</button><div class="frz" id="frz"></div>`;
    if(S.set.mode==='zoom'){initZoom();loadMap()}else initPad()}
  $('#hud').innerHTML=hudHTML(p);if(S.set.mode==='zoom')applyRemoved()}
function buildWorld(){const w=$('#world'),vp=$('#vp');if(!w||!vp)return;const n=M.e.length,perm=S.set.shuffle?shuf(Array.from({length:n},(_,i)=>i)):null;
  w.style.width=M.w+'px';w.style.height=M.h+'px';
  w.innerHTML=M.e.map((e,i)=>{const s=perm?perm[i]:i;return `<i class="pe" data-i="${i}" style="left:${M.x[s]}px;top:${M.y[s]}px">${e}</i>`}).join('');
  hid=new Set();zi=2;V.z=1;V.x=Math.random()*Math.max(0,M.w-vp.clientWidth);V.y=Math.random()*Math.max(0,M.h-vp.clientHeight);place();applyRemoved()}
function place(){const vp=$('#vp'),w=$('#world');if(!vp||!w||!M)return;
  V.x=Math.max(0,Math.min(M.w-vp.clientWidth/V.z,V.x));V.y=Math.max(0,Math.min(M.h-vp.clientHeight/V.z,V.y));
  w.style.transform=`scale(${V.z}) translate(${-V.x}px,${-V.y}px)`}
function initZoom(){const vp=$('#vp');
  vp.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y,moved:false};vp.setPointerCapture(e.pointerId)};
  vp.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>8)drag.moved=true;
    if(drag.moved){V.x=drag.vx-dx/V.z;V.y=drag.vy-dy/V.z;place()}};
  vp.onpointerup=e=>{const d=drag;drag=null;if(d&&!d.moved)tap(e)};vp.onpointercancel=()=>{drag=null};
  const zoom=k=>{const cx=V.x+vp.clientWidth/V.z/2,cy=V.y+vp.clientHeight/V.z/2;zi=Math.max(0,Math.min(ZS.length-1,zi+k));V.z=ZS[zi];V.x=cx-vp.clientWidth/V.z/2;V.y=cy-vp.clientHeight/V.z/2;place()};
  $('#zm').onclick=()=>zoom(-1);$('#zp').onclick=()=>zoom(1)}
const frozen=()=>{const p=S&&S.players.find(p=>p.id===me.id);return sNow()<Math.max(localFz,p?p.fz:0)};
function tap(e){if(!S||S.phase!=='play'||frozen())return;const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.dataset&&t.dataset.i!==undefined)claim(+t.dataset.i,t)}
async function claim(i,el){
  try{const r=await api({a:'claim',room,key:me.key,id:i});
    if(r.res==='ok'){hid.add(i);el.classList.add('gone');snd.pop();vib(30)}
    else if(r.res==='wrong'){localFz=r.until;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);snd.bad();vib([90,40,90])}
    else if(r.res==='frozen')localFz=r.until}catch(x){}}
function initPad(){const pad=$('#pad'),btn=$('#clk2');let acc={x:0,y:0},tm=null,last=null;
  const flush=()=>{tm=null;const k=1680/pad.clientWidth,dx=acc.x*k/1680,dy=acc.y*k/1080;acc={x:0,y:0};if(dx||dy)api({a:'move',room,key:me.key,dx,dy}).catch(()=>{})};
  pad.onpointerdown=e=>{last=[e.clientX,e.clientY];pad.setPointerCapture(e.pointerId)};
  pad.onpointermove=e=>{if(!last)return;acc.x+=e.clientX-last[0];acc.y+=e.clientY-last[1];last=[e.clientX,e.clientY];if(!tm)tm=setTimeout(flush,60)};
  pad.onpointerup=pad.onpointercancel=()=>{last=null;if(tm){clearTimeout(tm);flush()}};
  btn.onpointerdown=async e=>{e.preventDefault();if(!S||S.phase!=='play'||frozen())return;
    try{const r=await api({a:'click',room,key:me.key});const c=r.res==='ok'?'flash-ok':r.res==='wrong'?'flash-bad':'';
      if(r.res==='ok'){snd.pop();vib(30)}else if(r.res==='wrong'){localFz=r.until;snd.bad();vib([90,40,90])}
      if(c){btn.classList.add(c);setTimeout(()=>btn.classList.remove(c),350)}}catch(x){}}}
async function join(){unlock();try{start(await api({a:'join',room,name:$('#nm').value}))}catch(x){msg=x;drawPhone()}}
function start(j){me=j;msg='';localStorage['rush_'+room]=JSON.stringify(j);draw();connect(`room=${room}&key=${j.key}`)}

/* ---------- clock, countdown, freeze ---------- */
function tick(){if(!S)return;const n=sNow(),cd=$('#cd');
  if(cd){if(S.phase==='countdown'){const k=Math.ceil((S.startsAt-n)/1000);cd.className='cd show';cd.textContent=k>0?k:'GO!';if(k!==lastN){lastN=k;if(isHost&&k>0)snd.tick()}}else cd.className='cd'}
  const ck=$('#clock')||$('#clk');if(ck)ck.textContent=clockText();
  const fz=$('#frz');if(fz&&me){const p=S.players.find(p=>p.id===me.id),left=Math.max(localFz,p?p.fz:0)-n;
    if(left>0&&S.phase==='play'){fz.className='frz show';fz.textContent='❄️ Frozen '+(left/1000).toFixed(1)+'s'}else fz.className='frz'}}
setInterval(tick,100);

/* ---------- Boot ---------- */
(async()=>{
  if(isHost){draw();const saved=JSON.parse(localStorage.rushHost||'null')||{};
    const h=await api({a:'host',game:'rush',code:saved.code,hostKey:saved.hostKey});localStorage.rushHost=JSON.stringify(h);hk=h.hostKey;connect(`room=${h.code}`)}
  else{const saved=JSON.parse(localStorage['rush_'+room]||'null');
    if(saved){try{start(await api({a:'join',room,key:saved.key}))}catch(x){msg=x;drawPhone()}}else drawPhone()}
})();
</script>
<script>
(()=>{const b=document.getElementById('fs'),d=document.documentElement,req=d.requestFullscreen||d.webkitRequestFullscreen,
 on=()=>document.fullscreenElement||document.webkitFullscreenElement;
 if(!req||new URLSearchParams(location.search).has('room')){b.hidden=true;return}
 b.onclick=()=>on()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):req.call(d);
 const u=()=>{b.textContent=on()?'✕':'⛶'};document.addEventListener('fullscreenchange',u);document.addEventListener('webkitfullscreenchange',u)})();
</script>
</body>
